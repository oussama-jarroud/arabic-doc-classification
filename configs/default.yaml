# Central configuration for Arabic Document Classification (SANAD Khaleej Benchmark)

dataset:
  dataset_root: "data/raw"
  split_file: "splits/split_seed42.json"
  expected_raw_per_class: 6500
  categories:
    - "Culture"
    - "Finance"
    - "Medical"
    - "Politics"
    - "Religion"
    - "Sports"
    - "Tech"
  split_ratios:
    dev: 0.80
    test: 0.20
  cv_folds: 5
  seed: 42
  processed_dir: "data/processed"

preprocessing:
  target_pipelines:
    - "light_normalized"
    - "paper_heavy_stemming"
  serialization_format: "joblib"
  metadata_file: "results/preprocessing_metadata.json"

eda:
  class_summary_csv: "results/eda_class_summary.csv"
  top_terms_csv: "results/eda_top_terms.csv"
  class_counts_plot: "results/figures/class_counts_and_duplicates.png"
  doc_length_plot: "results/figures/doc_length_distribution.png"

preprocessing_pipelines:
  raw_char:
    - "remove_diacritics"
    - "remove_tatweel"
  light_normalized:
    - "remove_diacritics"
    - "remove_tatweel"
    - "normalize_hamza_alef"
    - "remove_non_arabic_punct"
    - "remove_stopwords"
  paper_heavy_stemming:
    - "remove_diacritics"
    - "remove_tatweel"
    - "normalize_hamza_alef"
    - "remove_non_arabic_punct"
    - "remove_stopwords"
    - "isri_stem"

features:
  bow:
    max_features: 50000
    min_df: 2
  tfidf:
    max_features: 50000
    min_df: 2
    sublinear_tf: true
  tfidf_char_wb:
    analyzer: "char_wb"
    ngram_range: [3, 5]
    max_features: 75000
    min_df: 3
    sublinear_tf: true
  tfidf_word_1_2:
    ngram_range: [1, 2]
    max_features: 50000
    min_df: 2
    sublinear_tf: true
  tfidf_word_1_3:
    ngram_range: [1, 3]
    max_features: 50000
    min_df: 2
    sublinear_tf: true
  sparse_fusion:
    word_tfidf:
      ngram_range: [1, 2]
      max_features: 50000
      min_df: 2
      sublinear_tf: true
    char_tfidf:
      analyzer: "char_wb"
      ngram_range: [3, 5]
      max_features: 50000
      min_df: 3
      sublinear_tf: true

dim_reduction:
  svd_300:
    n_components: 300
    random_state: 42
  svd_1000:
    n_components: 1000
    random_state: 42

classical_models:
  MultinomialNB:
    alpha: 1.0
  BernoulliNB:
    alpha: 1.0
  LogisticRegression:
    C: 1.0
    max_iter: 1000
    random_state: 42
  SGDClassifier:
    loss: "hinge"
    alpha: 0.0001
    max_iter: 1000
    random_state: 42
  LinearSVC:
    C: 1.0
    random_state: 42
  SVC:
    kernel: "rbf"
    C: 1.0
    max_iter: 2000
    random_state: 42

classical_experiments:
  results_csv: "results/results_classical.csv"
  models_dir: "models_saved"

feature_experiments:
  results_csv: "results/results_features.csv"
  models_dir: "models_saved"

advanced_models:
  LightGBM:
    max_depth: 7
    learning_rate: 0.1
    n_estimators: 100
    random_state: 42
    n_jobs: -1
    verbosity: -1
  XGBoost:
    max_depth: 7
    learning_rate: 0.1
    n_estimators: 100
    random_state: 42
    n_jobs: -1
    eval_metric: "mlogloss"
  HistGradientBoosting:
    max_depth: 7
    learning_rate: 0.1
    max_iter: 100
    random_state: 42

stacking_ensemble:
  base_estimators:
    - "LinearSVC"
    - "LogisticRegression"
    - "MultinomialNB"
  meta_learner: "LogisticRegression"
  meta_learner_params:
    C: 1.0
    max_iter: 1000
    random_state: 42
  cv: 5
  n_jobs: 1

advanced_experiments:
  results_csv: "results/results_advanced.csv"
  models_dir: "models_saved"

deep_learning:
  model_name: "ArabicCNN_1D"
  representation: "word_embeddings"
  vocab_size: 50000
  embedding_dim: 128
  num_filters: 128
  filter_sizes:
    - 3
    - 5
    - 7
  dropout: 0.5
  max_len: 512
  batch_size: 64
  learning_rate: 0.001
  epochs: 15
  early_stopping_patience: 3
  results_csv: "results/results_dl.csv"
  models_dir: "models_saved"




